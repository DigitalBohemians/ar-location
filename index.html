<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR Location</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #startBtn {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        padding: 18px 30px; font-size: 20px; background: white;
        border: none; border-radius: 12px; z-index: 999;
        font-weight: 700; cursor: pointer;
      }
      #scene { display: none; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <button id="startBtn">▶ AR Starten</button>

    <a-scene
      id="scene"
      vr-mode-ui="enabled: false"
      embedded
      renderer="antialias: true; alpha: true"
      arjs="sourceType: webcam; debugUIEnabled: false; videoTexture: true;"
    >
      <a-entity
        gps-new-entity-place="latitude: 37.350000; longitude: 23.466767"
        text="value: Willkommen bei ARExhibition!; color: white; align: center; width: 8"
        position="0 2 0"
        scale="20 20 20"
      ></a-entity>

      <a-camera gps-new-camera="gpsMinDistance: 10; gpsTimeInterval: 1000;"></a-camera>
    </a-scene>

    <script>
      document.getElementById('startBtn').addEventListener('click', () => {
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('scene').style.display = 'block';
      });
    </script>
  </body>
</html>
