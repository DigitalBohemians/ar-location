<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR Location</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <style>
      #startBtn {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        padding: 20px 40px; font-size: 22px; background: white;
        border: none; border-radius: 12px; z-index: 999;
        font-weight: bold; cursor: pointer;
      }
      #scene { display: none; width: 100%; height: 100%; }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <button id="startBtn" onclick="startAR()">▶ AR Starten</button>

    <a-scene id="scene"
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      renderer="antialias: true; alpha: true"
    >
      <a-entity
        gps-new-entity-place="latitude: 37.350002407548466; longitude: 23.466736721767788"
        position="0 1.6 0"
        text="value: Willkommen bei ARExhibition!; color: white; align: center; width: 20"
        scale="15 15 15"
      ></a-entity>

      <a-camera gps-new-camera="gpsMinDistance: 5"></a-camera>
    </a-scene>

    <script>
      function startAR() {
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('scene').style.display = 'block';
      }
    </script>
  </body>
</html>
